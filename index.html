<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放置RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>放置RPG</h1>
  <p id="offline-message"></p>

  <p>ステージ: <span id="stage">1</span></p>
  <p>ゴールド: <span id="gold">0</span></p>

  <div class="enemy" id="enemy">
    <p id="enemy-name">???</p>
    <p>HP: <span id="enemy-hp">?</span> / <span id="enemy-max-hp">?</span></p>
    <div class="hp-bar">
      <div id="hp-bar-fill" class="hp-bar-fill"></div>
    </div>
  </div>

  <p>攻撃力: <span id="attack-power">1</span></p>
  <button id="upgrade-button">攻撃力アップ (<span id="upgrade-cost">10</span>G) </button>
  <p>攻撃速度: <span id="attack-speed">1.00</span>回/秒</p>
  <button id="speed-button">攻撃速度アップ (<span id="speed-cost">50</span>G) </button>
  <p>ゴールド獲得量: ×<span id="gold-multiplier">1.0</span></p>
  <button id="gold-button">ゴールド獲得量アップ (<span id="gold-cost">25</span>G) </button>
  <button id="reset-button" class="danger">リセット</button>

  <script src="dist/game.js"></script>
</body>
</html>
